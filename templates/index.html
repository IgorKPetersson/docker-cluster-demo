<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Containerkompisen</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at top, #26345f 0, #101529 48%, #090c18 100%); color: #f6f7fb; }
      main { width: min(720px, calc(100% - 32px)); background: rgba(18, 24, 46, .88); border: 1px solid #35426d; border-radius: 24px; box-shadow: 0 24px 80px #03050c99; overflow: hidden; }
      header { padding: 26px 30px 18px; border-bottom: 1px solid #2e385c; }
      h1 { margin: 0 0 6px; font-size: clamp(1.5rem, 4vw, 2.2rem); }
      header p { margin: 0; color: #aeb8d7; }
      .badge { display: inline-block; margin-top: 12px; padding: 5px 10px; border-radius: 999px; background: #243968; color: #b9d2ff; font-size: .78rem; font-weight: 700; }
      #messages { min-height: 320px; max-height: 52vh; overflow-y: auto; padding: 24px 30px; display: flex; flex-direction: column; gap: 14px; }
      .message { max-width: 84%; padding: 13px 16px; border-radius: 16px; line-height: 1.45; white-space: pre-wrap; }
      .bot { align-self: flex-start; background: #283454; border-bottom-left-radius: 4px; }
      .user { align-self: flex-end; background: #5c6cff; border-bottom-right-radius: 4px; }
      form { display: flex; gap: 10px; padding: 20px 30px 26px; border-top: 1px solid #2e385c; }
      input { flex: 1; min-width: 0; padding: 14px 16px; border: 1px solid #46527a; border-radius: 12px; background: #11172c; color: white; font: inherit; outline: none; }
      input:focus { border-color: #7f8cff; box-shadow: 0 0 0 3px #5c6cff33; }
      button { padding: 0 22px; border: 0; border-radius: 12px; background: #7180ff; color: #080b16; font: inherit; font-weight: 800; cursor: pointer; }
      button:disabled { opacity: .55; cursor: wait; }
      @media (max-width: 520px) { header, #messages { padding-left: 20px; padding-right: 20px; } form { padding: 16px 20px 20px; } button { padding: 0 16px; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>🤖 Containerkompisen</h1>
        <p>En minimal chatbot i Docker och Kubernetes</p>
        <span class="badge">{{ platform }} · {{ "DEMO-LÄGE" if demo_mode else "OPENAI API" }}</span>
      </header>
      <section id="messages" aria-live="polite">
        <div class="message bot">Hej! Fråga mig något så skickar jag frågan vidare till chatbotens API.</div>
      </section>
      <form id="chat-form">
        <input id="question" aria-label="Din fråga" placeholder="Skriv en fråga …" autocomplete="off" required>
        <button type="submit">Skicka</button>
      </form>
    </main>
    <script>
      const form = document.querySelector('#chat-form');
      const input = document.querySelector('#question');
      const messages = document.querySelector('#messages');
      const button = form.querySelector('button');

      function addMessage(text, kind) {
        const item = document.createElement('div');
        item.className = `message ${kind}`;
        item.textContent = text;
        messages.appendChild(item);
        messages.scrollTop = messages.scrollHeight;
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const message = input.value.trim();
        if (!message) return;
        addMessage(message, 'user');
        input.value = '';
        button.disabled = true;
        try {
          const response = await fetch('/api/chat', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({message})
          });
          const data = await response.json();
          addMessage(data.answer || data.error || 'Något gick fel.', 'bot');
        } catch (_) {
          addMessage('Kunde inte nå servern.', 'bot');
        } finally {
          button.disabled = false;
          input.focus();
        }
      });

      const starter = new URLSearchParams(window.location.search).get('q');
      if (starter) {
        input.value = starter;
        form.requestSubmit();
      }
    </script>
  </body>
</html>
